name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The coverage report reads earlier runs' artifacts, comments on the PR and sets commit statuses.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        # No Windows: run locking and the review session use Unix file locks.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go build -v ./cmd/sift
      # Coverage is the same on both systems, so one report is enough. Statuses are informational until
      # thresholds are chosen, so coverage never blocks a merge.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        uses: getsentry/coverage-action@b3db4e382bd9859c913a96093a3d369b67f59177 # 0.4.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: coverage.out
          coverage-format: go
          disable-search: true
          enable-tests: false
          post-pr-comment: true
          informational-project: true
          informational-patch: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
