name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No Windows: run locking and the review session use Unix file locks.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      # gotestsum runs go test and also writes the results as JUnit XML, which Codecov's test analytics reads.
      - name: Test
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go build -v ./cmd/sift
      # Coverage is the same on both systems, so one upload is enough. A failed upload, such as during a
      # Codecov outage, does not fail the required test check.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
      # Test results come from both systems, flagged by system, and upload even when tests fail, which is
      # when they matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true
          flags: ${{ matrix.os }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: shellcheck
        run: shellcheck -s sh install.sh hooks/session-start
