# Coverage gates for pull requests. Both statuses are required checks on main.
coverage:
  status:
    project:
      default:
        # Total coverage may not drop below the base commit's.
        target: auto
        threshold: 0%
    patch:
      default:
        # At least 90% of the lines a pull request changes must be covered.
        target: 90%

ignore:
  # main only connects the CLI to the process; unit tests cannot run it.
  - "cmd/sift"
