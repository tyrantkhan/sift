version: 2

project_name: sift

builds:
  - main: ./cmd/sift
    binary: sift
    ldflags:
      - -s -w
      - -X github.com/tyrantkhan/sift/internal/cli.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    # No Windows: run locking and the review session use Unix file locks.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: tyrantkhan
    name: sift

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

homebrew_casks:
  - name: sift
    binaries:
      - sift
    directory: Casks
    repository:
      owner: tyrantkhan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      template: "https://github.com/tyrantkhan/sift/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/tyrantkhan/sift"
    description: "Decide an agent's review findings one at a time"
